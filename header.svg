<svg fill="none" width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; rx: 10px; }
    .border { stroke: #1f2937; stroke-width: 2; }
    .header-text { font-family: monospace; font-size: 13px; fill: #6b7280; }
    .title { font-family: monospace; font-size: 14px; font-weight: bold; fill: #38bdf8; }
    .label { font-family: monospace; font-size: 13px; fill: #9ca3af; }
    .value { font-family: monospace; font-size: 13px; fill: #e5e7eb; text-anchor: end; }
    .status { font-family: monospace; font-size: 11px; fill: #10b981; }
    .tag { font-family: monospace; font-size: 11px; fill: #38bdf8; }
    .code-symbol { font-family: monospace; font-size: 60px; fill: #a78bfa; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- Marco Principal -->
  <rect width="800" height="420" class="bg border"/>
  
  <!-- Controles tipo Terminal -->
  <circle cx="25" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="55" cy="20" r="5" fill="#10b981"/>
  <text x="400" y="24" text-anchor="middle" class="header-text">profile.sh --live</text>

  <!-- Panel Izquierdo: VISUAL.MAP (Animación Foto -> Código) -->
  <rect x="20" y="45" width="280" height="350" rx="6" stroke="#1e293b" fill="#090d16"/>
  <text x="35" y="70" class="title">VISUAL.MAP</text>
  <text x="285" y="70" class="header-text" text-anchor="end">300×340 / 1-BIT</text>
  
  <!-- Capa 1: Foto de Perfil (Aparece y Desaparece) -->
  <image href="https://github.com/facu-pieropan.png" x="60" y="110" width="160" height="160" clip-path="circle(80px at 80px 80px)">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="8s" repeatCount="indefinite" />
  </image>

  <!-- Capa 2: Símbolo de Código (Aparece cuando la foto desaparece) -->
  <text x="160" y="190" class="code-symbol">&lt;/&gt;
    <animate attributeName="opacity" values="0;0;1;1;0" dur="8s" repeatCount="indefinite" />
  </text>

  <text x="35" y="380" class="header-text">PTS 18000 · FS/SERPENTINE</text>

  <!-- Panel Derecho: SYSTEM.INFO -->
  <rect x="320" y="45" width="460" height="350" rx="6" stroke="#1e293b" fill="#090d16"/>
  <text x="340" y="70" class="title">SYSTEM.INFO</text>
  <text x="680" y="70" class="status">● LIVE</text>
  
  <g transform="translate(0, 15)">
    <text x="340" y="100" class="label">Subject</text>
    <text x="760" y="100" class="value">Facundo Pieropan</text>

    <text x="340" y="130" class="label">Role</text>
    <text x="760" y="130" class="value">Data Analyst · GIS &amp; Agronomy</text>

    <text x="340" y="160" class="label">Origin</text>
    <text x="760" y="160" class="value">Argentina</text>

    <text x="340" y="190" class="label">ToolChain</text>
    <text x="760" y="190" class="value">QGIS · Power BI · VSCode</text>

    <text x="340" y="220" class="label">Core.Lang</text>
    <text x="760" y="220" class="value">Python · SQL · Markdown</text>

    <text x="340" y="250" class="label">Grid.GitHub</text>
    <text x="760" y="250" class="value">@facu-pieropan</text>
  </g>

  <text x="340" y="380" class="status">● ALL SYSTEMS NOMINAL</text>
  <text x="760" y="380" class="header-text" text-anchor="end">ARG NODE</text>
</svg>
